plugins {
	id 'java'
	id 'application'
	id 'jacoco'
	id 'info.solidsoft.pitest' version '1.19.0'
}

def releaseVersion = providers.gradleProperty('releaseVersion')
if (releaseVersion.isPresent() && !(releaseVersion.get() ==~ /[1-9][0-9]*\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)/)) {
	throw new GradleException('releaseVersion must be MAJOR.MINOR.PATCH >= 1.0.0 without leading zeros')
}
version = releaseVersion.getOrElse('1.0.4-SNAPSHOT')

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

application {
	mainClass = 'ch.bbw.m450.tictactoe.TicTacToeMain'
}

tasks.named('run', JavaExec) {
	standardInput = System.in
}

dependencies {
	// Keep the JUnit 5 platform aligned with jqwik and the PIT JUnit 5 bridge.
	testImplementation platform('org.junit:junit-bom:5.14.4')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testImplementation 'org.assertj:assertj-core:3.27.7'
	testImplementation 'org.junit-pioneer:junit-pioneer:2.3.0'
	testImplementation 'net.jqwik:jqwik:1.10.1'
}

test {
	useJUnitPlatform()
	systemProperty 'jqwik.database', layout.buildDirectory.file('jqwik-database').get().asFile.absolutePath
	testLogging {
		events "passed", "skipped", "failed"
	}
	// Nach den Tests immer den JaCoCo-Report erzeugen.
	finalizedBy jacocoTestReport
}

tasks.withType(AbstractArchiveTask).configureEach {
	preserveFileTimestamps = false
	reproducibleFileOrder = true
}

tasks.named('jar', Jar) {
	manifest {
		attributes(
				'Main-Class': application.mainClass.get(),
				'Implementation-Version': project.version.toString()
		)
	}
}

jacoco {
	// 0.8.14 unterstützt Java-25-Bytecode (class file major version 69).
	toolVersion = '0.8.14'
}

jacocoTestReport {
	// Der Report braucht die Testergebnisse.
	dependsOn test
	reports {
		html.required = true   // HTML-Report (für Artifact / Ansicht)
		xml.required = true    // XML-Report (für spätere Auswertung / Coverage-Gate)
		csv.required = false
	}
}

jacocoTestCoverageVerification {
	dependsOn test
	violationRules {
		rule {
			limit {
				counter = 'BRANCH'
				value = 'COVEREDRATIO'
				minimum = 0.90
			}
		}
	}
}

tasks.named('check') {
	dependsOn jacocoTestCoverageVerification
}

pitest {
	pitestVersion = '1.30.0'
	junit5PluginVersion = '1.2.3'
	targetClasses = ['ch.bbw.m450.tictactoe.*']
	// jqwik properties run in test/check; PIT uses deterministic Jupiter tests.
	targetTests = ['ch.bbw.m450.tictactoe.*Test']
	outputFormats = ['HTML', 'XML']
	timestampedReports = false
	threads = 2
	mutationThreshold = 80
	timeoutConstInMillis = 10000
}
