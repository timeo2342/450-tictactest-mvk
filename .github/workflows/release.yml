name: Application Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: application-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Validate release tag and main ancestry
      id: version
      env:
        RELEASE_TAG: ${{ github.ref_name }}
      run: |
        if [[ ! "$RELEASE_TAG" =~ ^v[1-9][0-9]*\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
          echo "Expected vMAJOR.MINOR.PATCH with MAJOR >= 1." >&2
          exit 1
        fi
        git fetch origin main
        git merge-base --is-ancestor HEAD origin/main
        echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
        echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: temurin

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

    - name: Build and enforce quality gates
      env:
        RELEASE_VERSION: ${{ steps.version.outputs.version }}
      run: |
        chmod +x gradlew
        ./gradlew clean check e2eTest pitest jar "-PreleaseVersion=$RELEASE_VERSION"

    - name: Start the built JAR with a complete game
      env:
        RELEASE_VERSION: ${{ steps.version.outputs.version }}
      run: |
        printf '0\n2\n4\n6\n' | java -jar "build/libs/tictactest-$RELEASE_VERSION.jar" | tee build/jar-smoke.txt
        grep -F 'the winner is: CROSS' build/jar-smoke.txt

    - name: Prepare release notes
      shell: pwsh
      env:
        RELEASE_TAG: ${{ github.ref_name }}
        RELEASE_COMMIT: ${{ steps.version.outputs.commit }}
      run: |
        ./scripts/Prepare-Release.ps1 -Tag $env:RELEASE_TAG -Commit $env:RELEASE_COMMIT

    - name: Publish GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_TAG: ${{ github.ref_name }}
        RELEASE_VERSION: ${{ steps.version.outputs.version }}
      run: |
        gh release create "$RELEASE_TAG" "build/libs/tictactest-$RELEASE_VERSION.jar" \
          --verify-tag --title "TicTacTest $RELEASE_TAG" --notes-file build/release-notes.md

    - name: Download and run the published artifact
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_TAG: ${{ github.ref_name }}
        RELEASE_VERSION: ${{ steps.version.outputs.version }}
      run: |
        gh release download "$RELEASE_TAG" --pattern "tictactest-$RELEASE_VERSION.jar" --dir build/downloaded
        cmp "build/libs/tictactest-$RELEASE_VERSION.jar" "build/downloaded/tictactest-$RELEASE_VERSION.jar"
        printf '0\n2\n4\n6\n' | java -jar "build/downloaded/tictactest-$RELEASE_VERSION.jar" | tee build/release-smoke.txt
        grep -F 'the winner is: CROSS' build/release-smoke.txt

    - name: Upload release reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: release-reports
        path: |
          build/reports/
          build/test-results/
          build/*smoke.txt
