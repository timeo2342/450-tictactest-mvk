# Auftrag 1: Test Coverage mit JaCoCo.
#
# Bei jedem Build eines beliebigen Branches:
#   - führt die automatisierten Tests aus,
#   - JaCoCo ermittelt die Test Coverage,
#   - erzeugt einen HTML-Coverage-Report,
#   - lädt den vollständigen Report als GitHub Actions Artifact hoch.

name: Test Coverage (JaCoCo)

on:
  push:
    branches: [ "**" ]          # jeder Branch
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:            # manuelle Ausführung möglich

jobs:
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

    - name: Gradle Wrapper ausführbar machen
      run: chmod +x gradlew

    - name: Unit, E2E, 90-percent branch gate and mutation testing
      run: ./gradlew check e2eTest pitest

    - name: Upload all test, coverage and mutation reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: quality-reports
        path: |
          build/reports/
          build/test-results/
        if-no-files-found: error
