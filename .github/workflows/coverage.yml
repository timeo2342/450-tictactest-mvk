# Auftrag 1: Test Coverage mit JaCoCo.
#
# Bei jedem Build eines beliebigen Branches:
#   - führt die automatisierten Tests aus,
#   - JaCoCo ermittelt die Test Coverage,
#   - erzeugt einen HTML-Coverage-Report,
#   - lädt den vollständigen Report als GitHub Actions Artifact hoch.

name: Test Coverage (JaCoCo)

on:
  push:
    branches: [ "**" ]          # jeder Branch
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:            # manuelle Ausführung möglich

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

    - name: Gradle Wrapper ausführbar machen
      run: chmod +x gradlew

    # Führt die Tests aus; jacocoTestReport ist via finalizedBy angehängt
    # und wird hier zusätzlich explizit aufgerufen, um den Report sicher zu erzeugen.
    - name: Tests ausführen und Coverage-Report erzeugen
      run: ./gradlew test jacocoTestReport

    # Der vollständige HTML-Report wird als Artifact gespeichert.
    - name: HTML-Coverage-Report hochladen
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: jacoco-coverage-report
        path: build/reports/jacoco/test/html
