name: PR Coverage Gate

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
    - name: Check out current main
      uses: actions/checkout@v4
      with:
        ref: main
        path: baseline
        persist-credentials: false

    - name: Check out branch or exact PR head
      uses: actions/checkout@v4
      with:
        repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        path: candidate
        persist-credentials: false

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: temurin

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

    - name: Measure main
      working-directory: baseline
      run: |
        echo "main commit: $(git rev-parse HEAD)"
        chmod +x gradlew
        ./gradlew test jacocoTestReport

    - name: Measure branch
      working-directory: candidate
      run: |
        echo "branch commit: $(git rev-parse HEAD)"
        chmod +x gradlew
        ./gradlew test jacocoTestReport

    - name: Compare line coverage without rounding
      shell: pwsh
      run: |
        ./candidate/scripts/Compare-Coverage.ps1 `
          -MainReport ./baseline/build/reports/jacoco/test/jacocoTestReport.xml `
          -BranchReport ./candidate/build/reports/jacoco/test/jacocoTestReport.xml

    - name: Upload comparison reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-comparison
        path: |
          baseline/build/reports/
          candidate/build/reports/
