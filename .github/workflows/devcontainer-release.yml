# Auftrag 3: Continuous Deployment des DevContainers.
#
# Freigabe-Mechanismus: Dieser Workflow läuft NUR, wenn ein Version-Tag
# (z.B. v1.0.0) gesetzt wird. Ein Tag = bewusste, offizielle Freigabe.
# Ein gewöhnlicher Branch-Push erzeugt KEIN freigegebenes Image.
#
# Ablauf:
#   1. Image aus .devcontainer/Dockerfile bauen
#   2. mit der Version (v1.0.0) UND mit :latest taggen und nach ghcr.io pushen
#   3. die zentrale Versions-Datei aktualisieren
#   4. automatisch einen Pull Request öffnen, der die neue Version verwendet

name: DevContainer Release (CD)

on:
  push:
    tags:
      - 'v*'                     # nur Version-Tags lösen eine Freigabe aus
  workflow_dispatch:             # manuelle Freigabe möglich

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}-devcontainer

jobs:
  release-devcontainer:
    runs-on: ubuntu-latest
    permissions:
      contents: write            # Versions-Datei committen + Branch pushen
      packages: write            # Image nach ghcr.io pushen
      pull-requests: write       # automatischen PR erstellen

    steps:
    - uses: actions/checkout@v4

    - name: Version aus dem Tag ableiten
      id: version
      run: echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

    - name: Image-Namen normalisieren (lowercase)
      id: image
      run: echo "name=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

    - name: In die GitHub Container Registry einloggen
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # Image bauen und mit Version + latest pushen.
    - name: Image bauen und pushen (Version + latest)
      uses: docker/build-push-action@v6
      with:
        context: .
        file: .devcontainer/Dockerfile
        push: true
        tags: |
          ${{ steps.image.outputs.name }}:${{ steps.version.outputs.tag }}
          ${{ steps.image.outputs.name }}:latest

    # Zentrale Versions-Datei auf die neue Version setzen.
    - name: Versions-Datei aktualisieren
      run: |
        echo "${{ steps.version.outputs.tag }}" > .devcontainer/image-version.txt

    # Automatisch einen Pull Request öffnen, der die neue Version verwendet.
    - name: Pull Request mit neuer DevContainer-Version erstellen
      uses: peter-evans/create-pull-request@v6
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        branch: chore/bump-devcontainer-${{ steps.version.outputs.tag }}
        base: main
        commit-message: "chore: use devcontainer image ${{ steps.version.outputs.tag }}"
        title: "chore: DevContainer-Image auf ${{ steps.version.outputs.tag }} anheben"
        body: |
          Automatisch erstellter PR nach der Freigabe des DevContainer-Images.

          - Neues Image: `${{ steps.image.outputs.name }}:${{ steps.version.outputs.tag }}`
          - Auch verfügbar als `:latest`

          Dieser PR aktualisiert `.devcontainer/image-version.txt` auf die
          freigegebene Version.
        labels: |
          devcontainer
          automated
