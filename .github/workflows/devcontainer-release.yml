# Abschluss-Auftrag (324): Continuous Deployment des DevContainers.
#
# Ablauf:
#   1. DevContainer-Image wird bei Push auf main gebaut
#   2. Image wird nach ghcr.io gepusht (konkrete Version + :latest)
#   3. Nach erfolgreichem Push wird automatisch ein PR erstellt, der
#      devcontainer.json und CI-Image-Referenzen auf die neue Version umstellt.
#
# Trigger: Push auf main, der .devcontainer/Dockerfile betrifft (sonst würde jeder
# Code-Push unnötig ein neues Image bauen).

name: DevContainer Release (CD)

on:
  push:
    branches: [ "main" ]
    paths:
      # Nur das Dockerfile löst einen neuen Image-Build aus.
      # NICHT devcontainer.json — sonst würde der Auto-PR (der die
      # Versions-Referenz dort aktualisiert) eine Endlosschleife auslösen.
      - '.devcontainer/Dockerfile'
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}-devcontainer

concurrency:
  group: devcontainer-release
  cancel-in-progress: false

jobs:
  release-devcontainer:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write            # Branch für den PR pushen
      packages: write            # Image nach ghcr.io pushen
      pull-requests: write       # automatischen PR erstellen

    steps:
    - uses: actions/checkout@v4

    # Auch ein Re-run bekommt einen eigenen Tag.
    - name: Version bestimmen
      id: version
      run: echo "tag=v1.0.${{ github.run_number }}-attempt.${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

    - name: Image-Namen normalisieren (lowercase)
      id: image
      run: echo "name=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

    - name: In die GitHub Container Registry einloggen
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # Image bauen und mit konkreter Version + latest pushen.
    - name: Image bauen und pushen (Version + latest)
      uses: docker/build-push-action@v6
      with:
        context: .
        file: .devcontainer/Dockerfile
        push: true
        tags: |
          ${{ steps.image.outputs.name }}:${{ steps.version.outputs.tag }}
          ${{ steps.image.outputs.name }}:latest

    # Vorhandene Image-Referenzen auf die neue Version umstellen.
    # Ersetzt jede Referenz "<image>:<irgendein-tag>" durch die neue Version.
    - name: Referenzen auf neue Version aktualisieren
      run: |
        NEW="${{ steps.image.outputs.name }}:${{ steps.version.outputs.tag }}"
        # Regex: gleicher Image-Name, beliebiger bisheriger Tag -> neue Version
        ESC=$(echo "${{ steps.image.outputs.name }}" | sed 's/[\/&]/\\&/g')
        find .devcontainer .github/workflows -type f \( -name '*.json' -o -name '*.yml' \) -print0 \
          | xargs -0 sed -i -E "s#${ESC}:[A-Za-z0-9._-]+#${NEW}#g"
        echo "${{ steps.version.outputs.tag }}" > .devcontainer/image-version.txt
        echo "Aktualisiert auf: ${NEW}"
        grep -rn "${{ steps.image.outputs.name }}:" .devcontainer .github/workflows

    # Automatisch einen PR mit den aktualisierten Referenzen erstellen.
    - name: Pull Request mit neuer DevContainer-Version erstellen
      uses: peter-evans/create-pull-request@v6
      with:
        # PAT mit 'workflow'-Scope: nötig, weil der Auto-PR auch Dateien unter
        # .github/workflows/ ändert (das darf der Standard-GITHUB_TOKEN nicht).
        token: ${{ secrets.CD_PAT }}
        branch: chore/bump-devcontainer-${{ steps.version.outputs.tag }}
        base: main
        commit-message: "chore: use devcontainer image ${{ steps.version.outputs.tag }}"
        title: "chore: DevContainer-Image auf ${{ steps.version.outputs.tag }} anheben"
        body: |
          Automatisch erstellter PR nach Build & Push des DevContainer-Images.

          - Neues Image: `${{ steps.image.outputs.name }}:${{ steps.version.outputs.tag }}`
          - Auch verfügbar als `:latest`

          Dieser PR aktualisiert **`devcontainer.json`**, **`image-version.txt`**
          und die vorhandenen **CI-Image-Referenzen** auf die neue Version.
        labels: |
          devcontainer
          automated
