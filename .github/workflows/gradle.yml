# CI/CD-Pipeline für TicTacTest.
#
# Schritt 1+2: Das eigene Container-Image (aus .devcontainer/Dockerfile) wird
#              gebaut, mit :latest getaggt und in die GitHub Container Registry
#              (ghcr.io) hochgeladen.
# Schritt 3:   Die Tests laufen in genau diesem Image aus ghcr.io.
#
# GHCR-Doku: https://docs.github.com/en/packages/working-with-a-github-packages-registry/working-with-the-container-registry

name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  # Image-Name in der GitHub Container Registry (kleingeschrieben erforderlich).
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  # --- Schritt 1 + 2: Image bauen, taggen (:latest) und zu ghcr.io pushen ----
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write            # nötig, um in ghcr.io zu pushen

    steps:
    - uses: actions/checkout@v4

    - name: In die GitHub Container Registry einloggen
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # Image-Namen in Kleinbuchstaben umwandeln (ghcr verlangt lowercase).
    - name: Image-Namen normalisieren
      id: image
      run: echo "name=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

    - name: Image bauen und mit :latest pushen
      uses: docker/build-push-action@v6
      with:
        context: .
        file: .devcontainer/Dockerfile
        push: true
        tags: ${{ steps.image.outputs.name }}:latest

  # --- Schritt 3: Tests laufen IM Image aus ghcr.io -------------------------
  test:
    needs: build-and-push-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read             # nötig, um das Image aus ghcr.io zu ziehen

    # Der Job läuft direkt im selbst gebauten Container-Image.
    # --user root: GitHub Actions braucht Schreibrechte in seinen internen
    # Arbeitsverzeichnissen (/__w/...). Das Image selbst nutzt weiterhin den
    # non-root User "dev" (siehe Dockerfile) — nur der CI-Job läuft als root.
    container:
      image: ghcr.io/${{ github.repository }}:latest
      options: --user root
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
    - uses: actions/checkout@v4

    - name: Gradle Wrapper ausführbar machen
      run: chmod +x gradlew

    - name: Tests ausführen (im ghcr.io-Image, Java 25)
      run: ./gradlew test

    - name: Testreport hochladen
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-report
        path: build/reports/tests/test
