# CI-Pipeline für TicTacTest.
#
# Die Tests laufen im freigegebenen DevContainer-Image aus ghcr.io.
# Das Bauen/Pushen des Images übernimmt der Release-Workflow
# (.github/workflows/devcontainer-release.yml), ausgelöst durch einen Version-Tag.
# Hier wird IMMER die neueste freigegebene Version (:latest) verwendet.

name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read             # nötig, um das Image aus ghcr.io zu ziehen

    # Der Job läuft im freigegebenen DevContainer-Image.
    # --user root: GitHub Actions braucht Schreibrechte in seinen internen
    # Arbeitsverzeichnissen (/__w/...). Das Image nutzt sonst den non-root
    # User "dev" (siehe Dockerfile) — nur der CI-Job läuft als root.
    container:
      image: ghcr.io/${{ github.repository }}-devcontainer:latest
      options: --user root
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
    - uses: actions/checkout@v4

    - name: Gradle Wrapper ausführbar machen
      run: chmod +x gradlew

    - name: Tests ausführen (im DevContainer-Image, Java 25)
      run: ./gradlew test

    - name: Testreport hochladen
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-report
        path: build/reports/tests/test
